# =========================
# CosmoACE printer-side macros
# =========================
#
# Requires COSMOS firmware (Klipper/Kalico with gcode_shell_command and
# COSMOS's relaxed duplicate-section handling). This file must be included
# from printer.cfg AFTER the stock [include klipper-readonly/*.cfg] line
# (the installer handles this).
#
# Print flow:
#   ACE_START       -> heat, home, load slot to hub sensor -> printhead -> purge
#   T0..T7          -> cut -> tray -> one completed retract back to the slot ->
#                      load next (hub then printhead) -> purge -> resume
#   ACE_END         -> cut -> unload -> PRINT_END
#
# Optional toolhead sensor: add [include ace_toolhead.cfg] to printer.cfg and
# RESTART. Loads then stop on the toolhead switch instead of a blind
# load_to_printhead_mm push. Hub staging is always used either way.
#
# Slots 1-4 are the first ACE, 5-8 a second one declared as [ace2].

# --- Filament sensor takeover -------------------------------------------
# COSMOS ships [filament_switch_sensor filament_sensor] on pin PC0 with a
# runout_gcode that calls "PAUSE STATE=runout" - that would fire mid ACE
# load/unload and start the stock purge/load-filament prompt flow.
#
# COSMOS removes Klipper's duplicate-section checks, and this file is parsed
# after the stock config, so redefining the section here OVERRIDES the stock
# keys (the same mechanism COSMOS's macros.cfg uses to override client.cfg).
# The object name must stay "filament_sensor" - the stock PRINT_START/
# PRINT_END/PAUSE/RESUME macros query this exact name. Keys we don't set
# would leak through from the stock section, so every behavior-relevant key
# is set explicitly below (runout_distance and immediate_runout_gcode
# neutralize the stock smart-runout buffering).
# The optional toolhead sensor is a separate object in ace_toolhead.cfg.
[filament_switch_sensor filament_sensor]
switch_pin: PC0
pause_on_runout: False
event_delay: 0.2
debounce_delay: 0.02
# smart: use print_stats (not idle_timeout) to decide "is printing", so ACE
# feed/unload moves during a paused toolchange never count as printing.
smart: True
runout_distance: 0
runout_gcode:
  _ACE_SENSOR_EVENT EVENT=RUNOUT
insert_gcode:
  _ACE_SENSOR_EVENT EVENT=INSERT
immediate_runout_gcode:

# Slicer flush purges routinely exceed the stock 150mm limit (e.g. 264mm on
# a dark-to-light change). Same duplicate-section override as above: only
# this key changes, everything else leaks through from the stock [extruder].
[extruder]
max_extrude_only_distance: 1000

# Stock CUT_FILAMENT presses the blade once at F1200 and never verifies the
# cut; a missed cut lets ACE_UNLOAD drag uncut filament. Same duplicate-
# section override: identical motion, but the ram runs at 300mm/s and presses
# twice. Variables restated so nothing leaks from stock.
[gcode_macro CUT_FILAMENT]
variable_retract_length: 10
variable_pushback_length: 5
gcode:
  {% set self = printer["gcode_macro CUT_FILAMENT"] %}
  {% set retract_length = self.retract_length|float %}
  {% set pushback_length = self.pushback_length|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  M83
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    G1 E-{retract_length} F300
  {% endif %}
  G0 Y20 F12000
  G0 X255 F12000
  {% for _ in range(2) %}
    G0 Y4 F18000
    G0 Y20 F18000
  {% endfor %}
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    MOVE_TO_TRAY
    G1 E{pushback_length} F300
    G1 E-{pushback_length} F600
  {% endif %}
  M400

[gcode_shell_command ace_rpc]
command: /user-resource/ace-addon/ace-command.sh
timeout: 180.
verbose: True

# --- Configuration --------------------------------------------------------
# load_to_printhead_mm is the value everyone must tune: the distance from the
# hub sensor to the printhead. It is the blind push when no toolhead sensor is
# present, and it sets the full-unload retract length either way.
#
# The toolhead sensor is opt-in and self-declaring: the guided path turns on
# whenever the object named by toolhead_sensor_name exists, i.e. whenever
# printer.cfg includes ace_toolhead.cfg. There is no separate enable flag to
# keep in sync. With it enabled, tune load_to_toolhead_search_mm and
# load_past_toolhead_mm.

[gcode_macro _ACE_CONFIG]
variable_sensor_name: "filament_sensor"
# Object declared by the optional ace_toolhead.cfg. Its presence is the switch.
variable_toolhead_sensor_name: "toolhead_runout_sensor"
variable_load_to_sensor_search_mm: 1200
# Max search from hub sensor -> toolhead sensor (only needs to exceed real run).
variable_load_to_toolhead_search_mm: 900
# Extra push after the toolhead switch to seat filament in the extruder gears.
variable_load_past_toolhead_mm: 15
variable_load_to_printhead_mm: 730
variable_unload_to_sensor_search_mm: 900
# Full-unload retract = load_to_printhead_mm + this: hub clearance plus slip
# margin. Over-length is safe; the ACE parks the filament at the slot.
variable_unload_extra_mm: 170
variable_retract_past_sensor_mm: 90
# Note: the spool take-up rollers rewind slower than the feed gear retracts;
# fast retracts trade slack inside the ACE for speed. Drop retract back to
# ~25 (or set retract_mode = 1 in ace-addon.conf) if slack becomes a problem.
variable_feed_speed_mm_s: 50
variable_retract_speed_mm_s: 75
variable_purge_mm: 40
variable_purge_speed_mm_s: 3
variable_purge_temp: 250
variable_sync_load_mm: 40
variable_sync_load_chunk_mm: 5
gcode:

[gcode_macro _ACE_STATE]
variable_mode: "idle"
variable_current_slot: -1
variable_pending_slot: -1
gcode:

[gcode_macro _ACE_RESET_STATE]
gcode:
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=mode VALUE='"idle"'
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE=-1
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE=-1
  UPDATE_DELAYED_GCODE ID=_ACE_DELAYED_RESUME DURATION=0

# --- Status / helpers ------------------------------------------------------

[gcode_macro ACE_STATUS]
description: Print current ACE state for troubleshooting
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set hub_name = cfg.sensor_name|string %}
  {% set hub_object = "filament_switch_sensor " ~ hub_name %}
  {% set hub = printer[hub_object].filament_detected|int if hub_object in printer else -1 %}
  {% set th_name = cfg.toolhead_sensor_name|string %}
  {% set th_object = "filament_switch_sensor " ~ th_name %}
  {% set th = printer[th_object].filament_detected|int if th_name != "" and th_object in printer else -1 %}
  RESPOND TYPE=echo MSG="ACE mode={st.mode} current_slot={st.current_slot} pending_slot={st.pending_slot} sensor={hub_name}:{hub} toolhead={th_name}:{th}"

# All slot macros accept 1-8. Slots 5-8 address a second ACE declared as
# [ace2] in ace-addon.conf - its own USB device behind the first unit's hub
# pass-through - and work with or without the daemon.
[gcode_macro ACE_SLOT_STATUS]
description: Query ACE slot readiness from the addon service
gcode:
  {% set slot = params.SLOT|int %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_SLOT_STATUS requires SLOT=1..8") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="slot-status {slot}"

[gcode_macro ACE_SET_FILAMENT]
description: Set a slot's filament info on the ACE: SLOT=1..8 TYPE=PLA COLOR=RRGGBB
gcode:
  {% set slot = params.SLOT|default(1)|int %}
  {% set ftype = params.TYPE|default("PLA")|string %}
  {% set color = params.COLOR|default("FFFFFF")|string %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_SET_FILAMENT requires SLOT=1..8") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="set-filament {slot} {ftype} {color}"
  RESPOND TYPE=echo MSG="ACE: slot {slot} set to {ftype} {color}"

# RUN_SHELL_COMMAND never aborts a macro on failure, so after every shell
# call that must have moved filament we verify the sensor and raise here.
[gcode_macro _ACE_VERIFY_SENSOR]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set want = params.TRIGGERED|int %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% if sensor_name == "" %}
    { action_raise_error("ACE sensor check failed: no sensor name configured") }
  {% endif %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% if sensor_object not in printer %}
    { action_raise_error("ACE sensor check failed: sensor '%s' is not configured" % (sensor_name,)) }
  {% endif %}
  {% set sensor = printer[sensor_object].filament_detected|int %}
  {% if sensor != want %}
    { action_raise_error("ACE sensor '%s' check failed: expected %s but sensor is %s" % (sensor_name, "triggered" if want else "clear", "triggered" if sensor else "clear")) }
  {% endif %}

# Fire-and-forget feed plus wait-for-idle, used by ACE_SYNC_LOAD so the ACE
# and the extruder can move at the same time.
[gcode_macro _ACE_SLOT_LOAD_RAW]
gcode:
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed {params.SLOT|int} {params.LENGTH|float|int} {params.SPEED|float|int}"

[gcode_macro _ACE_SLOT_WAIT_IDLE_RAW]
gcode:
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="wait-motion {params.SLOT|int} {params.TIMEOUT_S|default(5)|float}"

[gcode_macro _ACE_LIFT]
gcode:
  {% set pos = printer.gcode_move.gcode_position %}
  {% set lift = [5.0, printer.toolhead.axis_maximum.z - pos.z]|min %}
  {% if "xyz" in printer.toolhead.homed_axes and lift > 0 %}
    G91
    G1 Z{lift} F600
    G90
    M400
  {% endif %}

# --- Single-step moves ------------------------------------------------------

[gcode_macro ACE_LOAD_TO_SENSOR]
description: Feed a slot until the filament sensor triggers
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set sensor = printer["filament_switch_sensor " ~ cfg.sensor_name].filament_detected|int %}
  {% set length = cfg.load_to_sensor_search_mm|float %}
  {% set speed = cfg.feed_speed_mm_s|float %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_LOAD_TO_SENSOR requires SLOT=1..8") }
  {% elif sensor %}
    { action_raise_error("ACE_LOAD_TO_SENSOR refused: sensor already triggered (unload first)") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-to-sensor {slot} {length|int} {speed|int} {cfg.sensor_name} {(length / speed + 10)|round(1)}"
  _ACE_VERIFY_SENSOR TRIGGERED=1
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  RESPOND TYPE=echo MSG="ACE: slot {slot} loaded to sensor"

[gcode_macro ACE_LOAD_TO_TOOLHEAD]
description: Feed from the hub sensor until the toolhead sensor triggers, then seat past it
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.pending_slot)|int %}
  {% set sensor_name = params.SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set search = params.SEARCH|default(cfg.load_to_toolhead_search_mm)|float %}
  {% set past = params.PAST|default(cfg.load_past_toolhead_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}
  {% if sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD refused: toolhead sensor '%s' is not configured (add [include ace_toolhead.cfg] to printer.cfg and RESTART)" % (sensor_name,)) }
  {% elif slot < 1 or slot > 8 %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD requires SLOT=1..8 or a pending slot") }
  {% elif printer[sensor_object].filament_detected|int %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD refused: toolhead sensor is already triggered, clear the extruder first") }
  {% elif search <= 0 %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD requires SEARCH>0") }
  {% elif past < 0 %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD requires PAST>=0") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-to-sensor {slot} {search|int} {speed|int} {sensor_name} {(search / speed + 10)|round(1)}"
  _ACE_VERIFY_SENSOR TRIGGERED=1 SENSOR={sensor_name}
  {% if past > 0 %}
    RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-wait {slot} {past|int} {speed|int} {(past / speed + 30)|round(1)}"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  RESPOND TYPE=echo MSG="ACE: slot {slot} at toolhead (+{past}mm into extruder)"

[gcode_macro ACE_LOAD_TO_PRINTHEAD]
description: Push the pending slot from the hub sensor to the printhead
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.pending_slot)|int %}
  {% set sensor = printer["filament_switch_sensor " ~ cfg.sensor_name].filament_detected|int %}
  {% set length = params.LENGTH|default(cfg.load_to_printhead_mm)|float %}
  {% set speed = cfg.feed_speed_mm_s|float %}
  {% set toolhead_name = cfg.toolhead_sensor_name|string %}
  {% set toolhead_present = toolhead_name != "" and ("filament_switch_sensor " ~ toolhead_name) in printer %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_LOAD_TO_PRINTHEAD requires SLOT=1..8 or a pending slot") }
  {% elif not sensor %}
    { action_raise_error("ACE_LOAD_TO_PRINTHEAD refused: sensor is not triggered") }
  {% endif %}
  {% if toolhead_present %}
    ACE_LOAD_TO_TOOLHEAD SLOT={slot} SPEED={speed}
  {% else %}
    RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-wait {slot} {length|int} {speed|int} {(length / speed + 30)|round(1)}"
    RESPOND TYPE=echo MSG="ACE: slot {slot} pushed to printhead"
  {% endif %}

[gcode_macro ACE_UNLOAD_TO_SENSOR]
description: Retract a slot until the filament sensor clears
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set sensor = printer["filament_switch_sensor " ~ cfg.sensor_name].filament_detected|int %}
  {% set length = cfg.unload_to_sensor_search_mm|float %}
  {% set speed = cfg.retract_speed_mm_s|float %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_UNLOAD_TO_SENSOR requires SLOT=1..8 or a current slot") }
  {% endif %}
  {% if not sensor %}
    RESPOND TYPE=echo MSG="ACE: sensor already clear"
  {% else %}
    RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="retract-to-sensor {slot} {length|int} {speed|int} {cfg.sensor_name} {(length / speed + 10)|round(1)}"
    _ACE_VERIFY_SENSOR TRIGGERED=0
    RESPOND TYPE=echo MSG="ACE: slot {slot} unloaded to sensor"
  {% endif %}

[gcode_macro ACE_CLEAR_HUB]
description: Retract past the sensor until the hub path is confirmed clear
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_CLEAR_HUB requires SLOT=1..8 or a current slot") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="clear-hub {slot} {cfg.retract_past_sensor_mm|int}"
  _ACE_VERIFY_SENSOR TRIGGERED=0
  RESPOND TYPE=echo MSG="ACE: hub clear (slot {slot})"

[gcode_macro ACE_SYNC_LOAD]
description: Feed the ACE and extruder together in chunks to pull filament through the hotend
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.pending_slot)|int %}
  {% set length = cfg.sync_load_mm|float %}
  {% set chunk = cfg.sync_load_chunk_mm|float %}
  {% set speed = cfg.purge_speed_mm_s|float %}
  {% set chunk_count = (length / chunk)|int %}
  {% set remainder = length - (chunk_count * chunk) %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_SYNC_LOAD requires SLOT=1..8 or a pending slot") }
  {% elif not printer.extruder.can_extrude %}
    { action_raise_error("ACE_SYNC_LOAD refused: nozzle is below min_extrude_temp") }
  {% endif %}
  SAVE_GCODE_STATE NAME=ace_sync_load_state
  M83
  {% for _ in range(chunk_count) %}
    _ACE_SLOT_LOAD_RAW SLOT={slot} LENGTH={chunk} SPEED={speed}
    G1 E{chunk} F{speed * 60}
    M400
    _ACE_SLOT_WAIT_IDLE_RAW SLOT={slot} TIMEOUT_S={(chunk / speed + 5)|round(1)}
    G4 P250
  {% endfor %}
  {% if remainder > 0.001 %}
    _ACE_SLOT_LOAD_RAW SLOT={slot} LENGTH={remainder} SPEED={speed}
    G1 E{remainder} F{speed * 60}
    M400
    _ACE_SLOT_WAIT_IDLE_RAW SLOT={slot} TIMEOUT_S={(remainder / speed + 5)|round(1)}
  {% endif %}
  RESTORE_GCODE_STATE NAME=ace_sync_load_state
  RESPOND TYPE=echo MSG="ACE: slot {slot} synced through hotend"

[gcode_macro ACE_PURGE]
description: Purge at the tray (assumes nozzle is at the tray and hot)
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set length = params.LENGTH|default(cfg.purge_mm)|float %}
  {% set speed = cfg.purge_speed_mm_s|float %}
  {% set max_e = printer.configfile.settings.extruder.max_extrude_only_distance|default(50.0)|float %}
  {% if length <= 0 %}
    { action_raise_error("ACE_PURGE requires LENGTH>0") }
  {% elif length > max_e %}
    { action_raise_error("ACE_PURGE LENGTH=%.0f exceeds max_extrude_only_distance=%.0f" % (length, max_e)) }
  {% elif not printer.extruder.can_extrude %}
    { action_raise_error("ACE_PURGE refused: nozzle is below min_extrude_temp") }
  {% endif %}
  SAVE_GCODE_STATE NAME=ace_purge_state
  M83
  G1 E{length} F{speed * 60}
  M400
  RESTORE_GCODE_STATE NAME=ace_purge_state
  RESPOND TYPE=echo MSG="ACE: purged {length}mm"

[gcode_macro ACE_WIPE]
description: Solidify and flick the purge blob off at the tray (COSMOS KICK)
gcode:
  KICK
  M400

# --- Composite load / unload -----------------------------------------------

[gcode_macro ACE_LOAD]
description: Full load of a slot - to sensor, to printhead, sync through hotend, purge, wipe
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set temp = params.TEMP|default(cfg.purge_temp)|int %}
  {% set purge = params.PURGE|default(cfg.purge_mm)|float %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_LOAD requires SLOT=1..8") }
  {% elif temp < 180 %}
    { action_raise_error("ACE_LOAD requires TEMP>=180") }
  {% endif %}
  MOVE_TO_TRAY
  ACE_LOAD_TO_SENSOR SLOT={slot}
  G4 P500
  ACE_LOAD_TO_PRINTHEAD SLOT={slot}
  M109 S{temp}
  ACE_SYNC_LOAD SLOT={slot}
  # Feed assist: the ACE follows the extruder's pull for the purge and the
  # rest of the print, instead of the extruder dragging against the bowden.
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="assist-start {slot}"
  ACE_PURGE LENGTH={purge}
  ACE_WIPE
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={slot}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  RESPOND TYPE=echo MSG="ACE: slot {slot} loaded"

[gcode_macro ACE_UNLOAD]
description: Full unload of the active slot - cut, one completed retract back to the slot
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set retract = cfg.load_to_printhead_mm|float + cfg.unload_extra_mm|float %}
  {% set speed = cfg.retract_speed_mm_s|float %}
  {% set toolhead_name = cfg.toolhead_sensor_name|string %}
  {% set has_toolhead = toolhead_name != "" and ("filament_switch_sensor " ~ toolhead_name) in printer %}
  {% if slot < 1 or slot > 8 %}
    { action_raise_error("ACE_UNLOAD requires SLOT=1..8 or a current slot") }
  {% endif %}
  # Assist must be off before retracting, or it fights the unwind.
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="assist-stop {slot}"
  # Pulling filament through a cold melt zone jams; heat if needed.
  {% if not printer.extruder.can_extrude %}
    M109 S{cfg.purge_temp}
  {% endif %}
  # COSMOS native: cut at the blade, move to the tray, back filament out of
  # the extruder gears 30mm.
  UNLOAD_FILAMENT
  # UNLOAD_FILAMENT exits to Y250 - 14mm in FRONT of the tray - leaving the
  # hot nozzle dripping beside it for the whole respool. Park back over it.
  MOVE_TO_TRAY
  # One completed unwind for the whole path: the ACE only respools while an
  # unwind command runs to completion - stop_unwind_filament mid-move skips
  # the spool take-up and piles up slack. Over-retract is safe (the ACE
  # parks the filament at the slot); the sensor is verified afterwards
  # instead of being used to stop the move.
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="retract-wait {slot} {retract|int} {speed|int} {(retract / speed + 30)|round(1)}"
  {% if has_toolhead %}
    _ACE_VERIFY_SENSOR TRIGGERED=0 SENSOR={toolhead_name}
  {% endif %}
  _ACE_VERIFY_SENSOR TRIGGERED=0
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE=-1
  RESPOND TYPE=echo MSG="ACE: slot {slot} unloaded"

# --- Print lifecycle ---------------------------------------------------------

[gcode_macro ACE_START]
description: Blocking print start - heat, home, load the slot, purge, wipe
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|int %}
  {% set bed = params.BED|int %}
  {% set temp = params.TEMP|int %}
  {% set chamber = params.CHAMBER|default(0)|int %}
  {% set purge = params.PURGE|default(cfg.purge_mm)|float %}
  {% set sensor = printer["filament_switch_sensor " ~ cfg.sensor_name].filament_detected|int %}
  {% set toolhead_name = cfg.toolhead_sensor_name|string %}
  {% set toolhead_object = "filament_switch_sensor " ~ toolhead_name %}
  {% set toolhead_sensor = printer[toolhead_object].filament_detected|int if toolhead_name != "" and toolhead_object in printer else 0 %}
  {% set leftover = sensor or toolhead_sensor %}
  {% set known_slot = st.current_slot|int if (st.current_slot|int >= 1 and st.current_slot|int <= 8) else st.pending_slot|int %}
  {% if "SLOT" not in params or "BED" not in params or "TEMP" not in params %}
    { action_raise_error("ACE_START requires SLOT, BED and TEMP") }
  {% elif slot < 1 or slot > 8 %}
    { action_raise_error("ACE_START requires SLOT=1..8") }
  {% elif temp < 180 %}
    { action_raise_error("ACE_START requires TEMP>=180") }
  {% endif %}
  CLEAR_PAUSE
  # COSMOS PAUSE/RESUME reheat with M109 S{_global_var.target_extruder};
  # record the print temperature the way PRINT_START normally does.
  SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=target_extruder VALUE={temp}
  M140 S{bed}
  M104 S140
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  # Recover leftover filament from a cancelled or interrupted print.
  {% if toolhead_sensor and not sensor %}
    # Filament at the toolhead with a clear hub is not attached to any slot:
    # retracting the slot cannot move it. Needs hands.
    { action_raise_error("ACE_START refused: filament at the toolhead sensor but the hub is clear - it is not connected to a slot. Clear the extruder by hand, then retry.") }
  {% elif leftover %}
    {% if known_slot >= 1 and known_slot <= 8 %}
      RESPOND TYPE=echo MSG="ACE: unloading leftover filament from slot {known_slot}"
      ACE_UNLOAD SLOT={known_slot}
    {% else %}
      { action_raise_error("ACE_START refused: filament at sensor but slot unknown. Run ACE_UNLOAD SLOT=<n> first.") }
    {% endif %}
  {% endif %}
  M190 S{bed}
  {% if chamber > 0 %}
    M191 S{chamber}
  {% endif %}
  _ACE_RESET_STATE
  ACE_LOAD SLOT={slot} TEMP={temp} PURGE={purge}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=mode VALUE='"print"'

[gcode_macro _ACE_TOOLCHANGE]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set next_slot = params.SLOT|int %}
  {% set current_slot = st.current_slot|int %}
  {% set temp = params.TEMP|default(printer.extruder.target if printer.extruder.target >= 180 else cfg.purge_temp)|int %}
  {% set purge = params.PURGE|default(cfg.purge_mm)|float %}
  {% if next_slot < 1 or next_slot > 8 %}
    { action_raise_error("_ACE_TOOLCHANGE requires SLOT=1..8") }
  {% elif printer.print_stats.state|lower != "printing" %}
    { action_raise_error("_ACE_TOOLCHANGE requires an active print") }
  {% elif printer.pause_resume.is_paused %}
    { action_raise_error("_ACE_TOOLCHANGE refused: printer is already paused") }
  {% elif current_slot < 1 or current_slot > 8 %}
    { action_raise_error("_ACE_TOOLCHANGE requires a loaded slot (run ACE_START)") }
  {% elif next_slot == current_slot %}
    RESPOND TYPE=echo MSG="ACE: slot {next_slot} already active"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=target_extruder VALUE={temp}
    PAUSE_BASE
    G4 P250
    _ACE_LIFT
    ACE_UNLOAD SLOT={current_slot}
    ACE_LOAD SLOT={next_slot} TEMP={temp} PURGE={purge}
    # Let the MCU clock sync re-settle before print moves resume: the purge
    # drains a ~45s single-move buffer to zero, and resuming with no
    # scheduling headroom is where "Timer too close" fired (2026-08-23).
    M400
    G4 P1000
    UPDATE_DELAYED_GCODE ID=_ACE_DELAYED_RESUME DURATION=0.1
  {% endif %}

[gcode_macro ACE_END]
description: End of print - unload the active slot and run COSMOS PRINT_END
gcode:
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set current_slot = st.current_slot|int %}
  {% if current_slot >= 1 and current_slot <= 8 %}
    _ACE_LIFT
    ACE_UNLOAD SLOT={current_slot}
  {% else %}
    RESPOND TYPE=echo MSG="ACE: no active slot to unload"
  {% endif %}
  M104 S0
  _ACE_RESET_STATE
  PRINT_END

# --- Events / resume ---------------------------------------------------------

[gcode_macro _ACE_SENSOR_EVENT]
gcode:
  {% set event = params.EVENT|default("")|string|upper %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% if st.mode == "print" and event in ("RUNOUT", "TOOLHEAD_RUNOUT") and printer.print_stats.state|lower == "printing" and not printer.pause_resume.is_paused %}
    RESPOND TYPE=echo MSG="ACE: runout detected during print ({event})"
    PAUSE
  {% endif %}

[gcode_macro _ACE_RESUME_PRINT]
gcode:
  # Use RESUME_BASE, not the COSMOS RESUME wrapper: the wrapper re-parks at
  # the tray and force-primes 50mm; the toolchange has already purged and
  # wiped. RESUME_BASE restores the position captured at PAUSE_BASE.
  {% if not printer.pause_resume.is_paused %}
    { action_raise_error("_ACE_RESUME_PRINT requires a paused print") }
  {% endif %}
  RESUME_BASE
  RESPOND TYPE=echo MSG="ACE: print resumed"

[delayed_gcode _ACE_DELAYED_RESUME]
gcode:
  {% if printer.pause_resume.is_paused %}
    _ACE_RESUME_PRINT
  {% endif %}

# --- Tool select (slicer emits T0..T3) ----------------------------------------

[gcode_macro _ACE_TOOL_SELECT]
gcode:
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|int %}
  {% if printer.print_stats.state|lower == "printing" and not printer.pause_resume.is_paused %}
    _ACE_TOOLCHANGE {rawparams}
  {% elif st.current_slot|int == slot %}
    RESPOND TYPE=echo MSG="ACE: slot {slot} already active"
  {% else %}
    RESPOND TYPE=echo MSG="ACE: tool select ignored outside print (use ACE_LOAD SLOT={slot})"
  {% endif %}

[gcode_macro T0]
gcode:
  _ACE_TOOL_SELECT SLOT=1 {rawparams}

[gcode_macro T1]
gcode:
  _ACE_TOOL_SELECT SLOT=2 {rawparams}

[gcode_macro T2]
gcode:
  _ACE_TOOL_SELECT SLOT=3 {rawparams}

[gcode_macro T3]
gcode:
  _ACE_TOOL_SELECT SLOT=4 {rawparams}

[gcode_macro T4]
gcode:
  _ACE_TOOL_SELECT SLOT=5 {rawparams}

[gcode_macro T5]
gcode:
  _ACE_TOOL_SELECT SLOT=6 {rawparams}

[gcode_macro T6]
gcode:
  _ACE_TOOL_SELECT SLOT=7 {rawparams}

[gcode_macro T7]
gcode:
  _ACE_TOOL_SELECT SLOT=8 {rawparams}
