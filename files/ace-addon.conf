[ace]
# "auto" finds the ACE (or ACEs) by their USB product string and assigns them
# in USB-topology order: the unit plugged into the printer is slots 1-4, one
# chained into its spare port is slots 5-8. Nothing to configure for either
# case, and it can never pick the printer's own MCU port.
# Only pin a port if auto-detection fails on your setup, and then pin every
# unit by its stable by-path name, e.g.
# /dev/serial/by-path/platform-4200000.usb-usb-0:1.4.3:1.0
# (by-id is no use: chained ACEs all report the same by-id name.)
serial_port = auto
baudrate = 115200
command_timeout_s = 1.0
rpc_timeout_s = 2.5
read_idle_s = 0.08
read_max_bytes = 4096
# Community drivers (DuckACE, ValgACE) default both speeds to 50. The spool
# take-up rollers rewind slower than the feed gear retracts, so fast retracts
# trade slack inside the ACE for speed - drop retract_speed to ~25 (or try
# retract_mode = 1) if slack becomes a problem.
feed_speed = 50
retract_speed = 75
# unwind_filament mode: 0 = normal, 1 = "enhanced" (undocumented)
retract_mode = 0
dry_fan_speed = 7000
log_path = /board-resource/ace-addon.log

# A second ACE = user slots 5-8. Chaining it into the first ACE's spare USB
# port is a plain hub pass-through: it is its own serial device, not something
# proxied through unit 1. With serial_port = auto above, it is detected and
# used automatically - this section is only needed to pin its port or to give
# it different tuning. Keys omitted here fall back to [ace].
#[ace2]
#serial_port = /dev/serial/by-path/platform-4200000.usb-usb-0:1.4.4.3:1.0

# The ACE drops its USB link ~3.5s after the last frame it received, which
# would clear feed assist mid-print. ace-keepalive.sh (a shell loop run by
# /etc/init.d/ace-keepalive) writes one get_status frame to every ACE every
# 2s to prevent that. It discovers the ports itself; nothing to set here.

[defaults]
feed_mm = 90
retract_mm = 90
dry_temp_c = 45
dry_minutes = 240

[klipper]
# Sensor options written by install.sh (HAS_TOOLHEAD). The installer mirrors
# has_toolhead into ace-addon.cfg macro variables. Hub staging is always on.
# has_toolhead=1: stop feeds at the Canvas/CC1 toolhead sensor (needs
# ace_toolhead.cfg included).
has_toolhead = 0
# COSMOS stock hub/chassis sensor object name
sensor_name = filament_sensor
# Canvas/CC1 extruder-inlet sensor object name (used when has_toolhead=1)
toolhead_sensor_name = toolhead_runout_sensor

[moonraker]
# COSMOS serves the Moonraker API on port 80 (not the usual Moonraker port)
url = http://127.0.0.1
timeout_s = 3.0
