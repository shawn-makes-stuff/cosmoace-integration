[ace]
# "auto" scans /dev/serial/by-id, /dev/ttyACM*, /dev/ttyUSB* and picks the first
# port that is not open by another process and not referenced by a Klipper
# "serial:" config line. On COSMOS the toolhead MCU owns /dev/ttyACM0, so never
# hardcode that. To pin the ACE, use its stable by-path name, e.g.
# /dev/serial/by-path/platform-4200000.usb-usb-0:1.2:1.0
serial_port = auto
baudrate = 115200
command_timeout_s = 1.0
rpc_timeout_s = 2.5
read_idle_s = 0.08
read_max_bytes = 4096
# Community drivers (DuckACE, ValgACE) default both speeds to 50. The spool
# take-up rollers rewind slower than the feed gear retracts, so fast retracts
# trade slack inside the ACE for speed - drop retract_speed to ~25 (or try
# retract_mode = 1) if slack becomes a problem.
feed_speed = 50
retract_speed = 75
# unwind_filament mode: 0 = normal, 1 = "enhanced" (undocumented)
retract_mode = 0
dry_fan_speed = 7000
log_path = /board-resource/ace-addon.log

# Second ACE unit (user slots 5-8), served by the daemon only. Daisy-chain
# is USB pass-through: each unit is its own serial device. Pin BOTH units by
# stable by-path/by-id names when two are connected - "auto" picks the first
# free port and cannot tell the units apart.
#[ace2]
#serial_port = /dev/serial/by-path/platform-4200000.usb-usb-0:1.3:1.0

[daemon]
# Unix socket the CLI talks to; the daemon heartbeats each ACE every
# heartbeat_s so the ACE's ~3.5s comms watchdog never drops the USB link.
socket_path = /var/run/cosmoace.sock
heartbeat_s = 1.5
# Loopback TCP for the busybox-nc thin client in ace-command.sh (avoids a
# ~1s python startup per macro call). 0 disables; localhost-only.
tcp_port = 7877

[defaults]
feed_mm = 90
retract_mm = 90
dry_temp_c = 45
dry_minutes = 240

[klipper]
# COSMOS names the stock filament sensor object "filament_sensor"
sensor_name = filament_sensor

[moonraker]
# COSMOS serves the Moonraker API on port 80 (not the usual Moonraker port)
url = http://127.0.0.1
timeout_s = 3.0
