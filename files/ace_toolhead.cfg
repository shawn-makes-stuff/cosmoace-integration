# =========================
# CosmoACE optional toolhead sensor
# =========================
#
# OPT-IN. The installer copies this file to /etc/klipper/config/ but does NOT
# include it - an un-included file is inert, so a stock printer is unaffected.
#
# To enable, add this line to printer.cfg (anywhere above the SAVE_CONFIG
# block) and RESTART:
#
#   [include ace_toolhead.cfg]
#
# That include is the whole switch. ace_macros.cfg turns on the guided load
# path whenever this sensor object exists - there is no second flag, and
# toggling never rewrites ace-addon.cfg, so your tuning survives.
#
# To disable again: delete the include line and RESTART.
#
# Hardware: Canvas / CC1 toolhead filament sensor at the extruder inlet.
# Verified free on stock COSMOS 26.07.0 (hotend MCU is an stm32f401xc; stock
# uses PC13/PC14/PC15/PB6/PA3/PB5/PA0/PC8/PA1/PC9/PA4/PC6/PC7 only).

[filament_switch_sensor toolhead_runout_sensor]
switch_pin: !hotend:PB2
pause_on_runout: False
event_delay: 0.2
debounce_delay: 0.02
# smart: use print_stats (not idle_timeout) to decide "is printing", so ACE
# feed/unload moves during a paused toolchange never count as printing.
smart: True
runout_distance: 0
runout_gcode:
  _ACE_SENSOR_EVENT EVENT=TOOLHEAD_RUNOUT
insert_gcode:
  _ACE_SENSOR_EVENT EVENT=TOOLHEAD_INSERT
immediate_runout_gcode:

# The guided-load macro ships here rather than in ace_macros.cfg so that a
# printer without the sensor does not carry a macro it can never run.
# ACE_LOAD_TO_PRINTHEAD delegates to this whenever the sensor object above
# exists. The sensor-name check below still earns its keep: it catches a
# variable_toolhead_sensor_name that does not match this section.
[gcode_macro ACE_LOAD_TO_TOOLHEAD]
description: Feed from the hub sensor until the toolhead sensor triggers, then seat past it
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.pending_slot)|int %}
  {% set sensor_name = params.SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set search = params.SEARCH|default(cfg.load_to_toolhead_search_mm)|float %}
  {% set past = params.PAST|default(cfg.load_past_toolhead_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}
  {% if cfg.bypass|int %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD refused: ACE bypass is on (ACE_SET_BYPASS ENABLE=0)") }
  {% elif sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD refused: toolhead sensor '%s' is not configured (add [include ace_toolhead.cfg] to printer.cfg and RESTART)" % (sensor_name,)) }
  {% elif slot < 1 or slot > 8 %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD requires SLOT=1..8 or a pending slot") }
  {% elif printer[sensor_object].filament_detected|int %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD refused: toolhead sensor is already triggered, clear the extruder first") }
  {% elif search <= 0 %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD requires SEARCH>0") }
  {% elif past < 0 %}
    { action_raise_error("ACE_LOAD_TO_TOOLHEAD requires PAST>=0") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-to-sensor {slot} {search|int} {speed|int} {sensor_name} {(search / speed + 10)|round(1)}"
  _ACE_VERIFY_SENSOR TRIGGERED=1 SENSOR={sensor_name}
  {% if past > 0 %}
    RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-wait {slot} {past|int} {speed|int} {(past / speed + 30)|round(1)}"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  RESPOND TYPE=echo MSG="ACE: slot {slot} at toolhead (+{past}mm into extruder)"
