# =========================
# CosmoACE optional toolhead hardware
# =========================
#
# Installed only when HAS_TOOLHEAD=1 (or answered yes at install).
# Included from printer.cfg as: [include ace_toolhead.cfg]
#
# Canvas / CC1 toolhead filament sensor at the extruder inlet, plus the
# front-cover and cutter buttons on the hotend MCU.

[filament_switch_sensor toolhead_runout_sensor]
pause_on_runout: False
switch_pin: !hotend:PB2
event_delay: 0.2
debounce_delay: 0.02
smart: True
runout_distance: 0
runout_gcode:
  _ACE_SENSOR_EVENT EVENT=TOOLHEAD_RUNOUT
insert_gcode:
  _ACE_SENSOR_EVENT EVENT=TOOLHEAD_INSERT
immediate_runout_gcode:

[gcode_button toolhead_front_cover_detection]
pin: hotend:PC4
press_gcode:
  RESPOND TYPE=echo MSG="The front fell off... thats not very typical."
release_gcode:
  RESPOND TYPE=echo MSG="Toolhead front cover re-attached"

[gcode_button toolhead_cutter_detection]
pin: !hotend:PC5
press_gcode:
  RESPOND TYPE=echo MSG="Toolhead cutter engaged"
release_gcode:
  RESPOND TYPE=echo MSG="Toolhead cutter disengaged"
