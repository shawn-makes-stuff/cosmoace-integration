# ─────────────────────────────────────────────────────────────────────────────
# AFC + ACE Pro on COSMOS — macros
#
# These are the Centauri-specific pieces AFC calls out to: the cutter, the
# purge, and the print-start prep. Coordinates are for a Centauri Carbon.
# MOVE_TO_TRAY, PAUSE_BASE, RESUME_BASE and _global_var all ship with COSMOS.
# ─────────────────────────────────────────────────────────────────────────────

# Double-press cut. A missed cut is expensive: the ACE retract then drags
# uncut filament back down the bowden, so it presses twice.
[gcode_macro CUT_FILAMENT]
variable_retract_length: 10
variable_pushback_length: 5
gcode:
  {% set self = printer["gcode_macro CUT_FILAMENT"] %}
  {% set retract_length = self.retract_length|float %}
  {% set pushback_length = self.pushback_length|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  M83
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    G1 E-{retract_length} F300
  {% endif %}
  G0 Y20 F12000
  G0 X255 F12000
  {% for _ in range(2) %}
    G0 Y4 F18000
    G0 Y20 F18000
  {% endfor %}
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    MOVE_TO_TRAY
    G1 E{pushback_length} F300
    G1 E-{pushback_length} F600
  {% endif %}
  M400

# Purge over the tray in ~100mm rounds, kicking the blob off between rounds.
# The part fan is forced off: a cooled blob welds to the tray and KICK cannot
# shear it. The slicer's fan speed is put back afterwards — slicers only emit
# M106 when the speed changes, so without that every layer after a
# mid-print toolchange prints uncooled (CosmoACE commit 08e513f).
# PURGE_LENGTH=0 (e.g. M600 with L0) skips the purge.
[gcode_macro POOP]
gcode:
    {% set purge_length = params.PURGE_LENGTH|default(200, true)|float %}
    {% set fan_speed = printer.fan.speed %}

    {% if purge_length <= 0 %}
        RESPOND MSG="Purge length {purge_length}mm, skipping purge"
    {% else %}
        {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
            {action_raise_error("Extruder temperature too low for purging. Please heat the extruder to at least 180C.")}
        {% endif %}

        {% set rounds = ((purge_length / 100)|round(0, 'ceil'))|int %}
        {% set per_round = (purge_length / rounds) %}

        RESPOND MSG="Purging {purge_length}mm of filament in {rounds} rounds of {per_round}mm each"

        {% for i in range(rounds) %}
            MOVE_TO_TRAY
            M83
            M106 S0
            RESPOND TYPE=command MSG="Purging {per_round}mm of filament ({i + 1}/{rounds})"
            G1 Y265 F1200
            G1 E{per_round} F300
            G1 Y264 F1200
            KICK
        {% endfor %}

        M106 S{(fan_speed * 255)|round|int}
    {% endif %}

# Ends with the part fan back at whatever it was when KICK started.
[gcode_macro KICK]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set retract_amount = global.retract_amount|float %}
    {% set fan_speed = printer.fan.speed %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Printer not homed")}
    {% endif %}

    {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
        {action_raise_error("Extruder not hot enough to kick")}
    {% endif %}

    G90
    M83

    MOVE_TO_TRAY
    G1 E-{retract_amount} F300
    M106 S255
    G4 P2000

    G1 X202 Y264.5 F6000
    G1 F8000
    G1 X181
    G1 X193
    G1 X165
    G1 X190
    G1 X165

    M106 S{(fan_speed * 255)|round|int}

    G1 Y250 F6000

    M400

# COSMOS ships UNLOAD_FILAMENT and 26.07.0 cannot delete a section, so remap it.
[gcode_macro UNLOAD_FILAMENT]
gcode:
    BT_TOOL_UNLOAD

# Slicer colour change. With T, change to that tool (L sets the purge,
# otherwise AFC's default applies). Without T it is a plain manual filament
# change, so pause — falling back to T0 would load the wrong colour.
[gcode_macro M600]
gcode:
    {% if 'T' in params %}
        T{params.T|int}{% if 'L' in params %} PURGE_LENGTH={params.L|float}{% endif %}
    {% else %}
        PAUSE
    {% endif %}

# Print-start prep, called from the slicer's start gcode AFTER PRINT_START.
# Parks over the purge tray, brings the nozzle to temperature there, and then
# either purges the tool that is already loaded or starts the change to the one
# the print asked for.
#
# The purge on the already-loaded path is the point of this macro: after a
# heat-up the nozzle has oozed and left air behind the tip, and the filament
# may not be fully seated in the gears. Purging pulls it the rest of the way
# with the extruder instead of the ACE shoving it, and gets flow going before
# the first line.
#
# The change path needs no purge here — AFC's TOOL_LOAD runs poop_cmd itself
# once the new lane is loaded.
[gcode_macro AFC_PRINT_PREP]
description: Park over the tray, heat there, then purge the loaded tool or change to the requested one
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set purge = params.PURGE_LENGTH|default(100)|int %}
    {% set temp = params.EXTRUDER|default(printer.extruder.target)|int %}
    {% set want = 'T' ~ tool %}

    {% set loaded = printer.AFC.current_load if 'AFC' in printer else none %}
    {% set lane_key = 'AFC_lane ' ~ loaded if loaded else '' %}
    {% set lane_map = printer[lane_key].map if lane_key and lane_key in printer else '' %}
    # AFC published `map` as a string until 1.2.x and as a list after, so
    # accept both rather than assuming a version
    {% set maps = lane_map.split(',') if lane_map is string else lane_map %}
    {% set maps = maps|map('trim')|list if maps else [] %}

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    MOVE_TO_TRAY
    {% if temp > 0 %}
        M109 S{temp}
    {% endif %}

    {% if want in maps %}
        RESPOND MSG="AFC: {want} already loaded ({loaded}), purging {purge}mm to seat the tip"
        POOP PURGE_LENGTH={purge}
    {% else %}
        RESPOND MSG="AFC: {want} not loaded (currently {loaded if loaded else 'nothing'}), changing"
        {want}
    {% endif %}
