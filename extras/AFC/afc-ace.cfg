# ─────────────────────────────────────────────────────────────────────────────
# AFC + Anycubic ACE Pro on COSMOS — hardware config
#
# Include this from printer.cfg AFTER the COSMOS includes, so the sensor
# override below wins:
#
#   [include klipper-readonly/*.cfg]
#   [include afc.cfg]          # written by AFC's own installer
#   [include afc-ace.cfg]
#   [include afc-ace-macros.cfg]
#
# EXPERIMENTAL. See README.md in this folder.
# ─────────────────────────────────────────────────────────────────────────────

# ── Stock frame sensor ───────────────────────────────────────────────────────
# The Centauri's runout sensor becomes AFC's hub sensor (read by name, since
# a pin can only be claimed once). Its stock runout behaviour has to go, or it
# fights AFC for the same event. Every key is restated so nothing
# behaviour-relevant leaks in from the section this overrides.
[filament_switch_sensor filament_sensor]
switch_pin: PC0
pause_on_runout: False
event_delay: 0.2
debounce_delay: 0.02
smart: True
runout_distance: 0
runout_gcode:
insert_gcode:
immediate_runout_gcode:

# Stock PRINT_START cancels the print (and RESUME refuses) when this sensor
# shows no filament. With an ACE, filament only reaches it during the first
# tool load, so those gates have to be muted. AFC still reads the live state.
[delayed_gcode _afc_ace_mute_sensor_gates]
initial_duration: 2
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

# ── The ACE unit ─────────────────────────────────────────────────────────────
# serial: find yours with `ls -l /dev/serial/by-path/`. Use a by-path name, not
# /dev/ttyACM0 — ACM numbering moves between boots.
[AFC_ACE ACE_1]
serial: /dev/serial/by-path/platform-4200000.usb-usb-0:1.4.3:1.0
unit_index: 0
hub: ACE_1
extruder: extruder
feed_speed: 50
retract_speed: 75
hub_sensor_name: filament_sensor
hub_clear_mm: 110         # park distance past the hub sensor, clears the splitter

# ── Lanes ────────────────────────────────────────────────────────────────────
# dist_hub is the slot -> hub-sensor distance. With a hub sensor it is only a
# cap (the sensor stops the feed), so err generous. Measure yours roughly and
# round up.
[AFC_lane lane1]
unit: ACE_1:1
map: T0
dist_hub: 1200
load_to_hub: False

[AFC_lane lane2]
unit: ACE_1:2
map: T1
dist_hub: 1200
load_to_hub: False

[AFC_lane lane3]
unit: ACE_1:3
map: T2
dist_hub: 1200
load_to_hub: False

[AFC_lane lane4]
unit: ACE_1:4
map: T3
dist_hub: 1200
load_to_hub: False

# ── Hub ──────────────────────────────────────────────────────────────────────
# The ACE has no real hub switch, so the hub is virtual and its state is
# derived from the unit's own slot flags.
#
# afc_bowden_length is the ONLY tuned number here: the blind push from the
# frame sensor to the extruder inlet. Sensor -> nozzle total is
# afc_bowden_length + tool_stn. Too short and the gears never grab (prints
# air on layer 1); too long and you get ooze before the purge. The first is
# the one that wastes a print, so if it comes up short, go UP in ~10mm steps.
#
# Tune it live with `SET_BOWDEN_LENGTH HUB=ACE_1 LENGTH=+10` (also accepts an
# absolute value, or `reset`). There is no save command — write the final
# number back into this file by hand.
[AFC_hub ACE_1]
switch_pin: virtual
afc_bowden_length: 710      # 710 + tool_stn 40 = 750mm sensor -> nozzle
enable_hub_runout: False

# ── Toolhead ─────────────────────────────────────────────────────────────────
# Sensorless toolhead (the CosmoACE default): the frame sensor homes the feed,
# afc_bowden_length is the blind push to the inlet, and tool_stn is the
# sync-load distance threading filament into the gears.
#
# If your toolhead has the inlet sensor wired, uncomment pin_tool_start and set
# tool_stn: 43.5 (measured inlet -> nozzle). The load then homes on that sensor
# instead and afc_bowden_length stops mattering.
[AFC_extruder extruder]
#pin_tool_start: !hotend:PB2
tool_stn: 40
tool_stn_unload: 32
tool_sensor_after_extruder: 0
tool_unload_speed: 15
tool_load_speed: 8

# A full load is one extrude-only move the length of the bowden.
[extruder]
max_extrude_only_distance: 1000

# ── Second (chained) ACE ─────────────────────────────────────────────────────
# Slots 5-8 on a second unit, both feeding through an 8-way splitter into the
# one frame sensor. Uncomment and set its serial to use it.
#
# optional: True    -> an unplugged unit is reported as a fact at PREP, not a
#                      startup failure
# monitor_only: True -> slot status, RFID and the dryer stay live in the UIs
#                      while every filament-motion command is refused (for a
#                      unit whose filament feeds a different printer)
#
#[AFC_ACE ACE_2]
#serial: /dev/serial/by-path/platform-4200000.usb-usb-0:1.4.4.3:1.0
#unit_index: 0
#optional: True
#hub: ACE_1
#extruder: extruder
#hub_sensor_name: filament_sensor
#hub_clear_mm: 110
#
#[AFC_lane lane5]
#unit: ACE_2:1
#map: T4
#dist_hub: 1400
#load_to_hub: False
#
#[AFC_lane lane6]
#unit: ACE_2:2
#map: T5
#dist_hub: 1400
#load_to_hub: False
#
#[AFC_lane lane7]
#unit: ACE_2:3
#map: T6
#dist_hub: 1400
#load_to_hub: False
#
#[AFC_lane lane8]
#unit: ACE_2:4
#map: T7
#dist_hub: 1400
#load_to_hub: False

# ── AFC itself ───────────────────────────────────────────────────────────────
[AFC]
VarFile: /etc/klipper/config/AFC.var
default_material_type: PLA
enable_sensors_in_gui: True
ignore_spoolman_material_temps: False
load_to_hub: False
moonraker_port: 80              # COSMOS serves moonraker on 80, not 7125
debug: True
z_hop: 5
resume_speed: 120
resume_z_speed: 25
led_fault: 1,0,0,0
led_ready: 0,0,0,0.5
led_not_ready: 1,0,0,0
led_loading: 0.2,0,0,0.5
led_tool_loaded: 1,0,0,1
led_buffer_advancing: 0,0,1,0
led_buffer_trailing: 0,1,0,0
led_buffer_disable: 0,0,0,0.25
led_spool_illuminate: 1,1,1,0
unload_on_runout: True
auto_home: True
enable_assist: False
spool_ratio: 2
enable_hub_runout: False
enable_tool_runout: True
homing_enabled: False           # no lane steppers to home: the ACE feeds itself
restore_extruder_temp_on_load_or_unload: True
lower_extruder_temp_on_change: False
default_material_temps: default: 240, PLA:210, PETG:240, ABS:260, ASA:260
tool_cut: True
tool_cut_cmd: CUT_FILAMENT
tool_cut_threshold: 10000
park: True
park_cmd: MOVE_TO_TRAY
poop: True
poop_cmd: POOP
kick: False
kick_cmd: KICK
wipe: False
form_tip: False
